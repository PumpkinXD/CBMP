name: Release Pack

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Sync pack version with tag
        run: |
          cd modrinth
          sed -i -E "s|^version = .*|version = \"${GITHUB_REF_NAME#v}\"|" pack.toml
          grep '^version' pack.toml

      - name: Export mrpack
        run: cd modrinth && packwiz mr export

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            modrinth/*.mrpack \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
